[workspace]
resolver = "2"
members = ["crates/oio", "crates/oio-serve"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/oio-dev/oio"

[workspace.dependencies]
oio = { path = "crates/oio" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"

# Heavy/optional runtime deps (enabled per feature, see crates/*/Cargo.toml)
# ORT 1.28's Linux static archive requires newer glibc/libstdc++ than the
# Ubuntu 22.04 baseline. Pin rc.10 (ORT 1.22) for the supported Linux ABI.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
tokenizers = { version = "0.21" }
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
