[package]
name = "oio"
description = "Production-oriented Rust decision engine (Jev/Laya-compatible wire protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tokenizer = ["dep:tokenizers"]
onnx = ["dep:ort", "tokenizer"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "tokenizer"]
cuda = ["onnx", "ort/cuda"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2.workspace = true
regex = "1"
tokenizers = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["accelerate"] }
